name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Use Node.js 22
      uses: actions/setup-node@v4
      with:
        node-version: '22'
        
    - name: Install Dependencies
      run: npm ci

    - name: Syntax Check
      run: |
        node --check server/index.mjs
        node --check server/db.js
        node --check server/blocks.js
